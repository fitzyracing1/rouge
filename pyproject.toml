[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Published as a separate distribution; the import name stays `rouge`.
name = "fitzyracing-rouge"
version = "1.0.2"
description = "Full Python ROUGE Score Implementation (not a wrapper) (maintained fork of rouge with the empty-token fix)"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "pltrdy", email = "pltrdy@gmail.com" }]
maintainers = [{ name = "Joshua Almeida", email = "fitzyracing1@gmail.com" }]
keywords = ["NL", "CL", "natural language processing", "computational linguistics", "summarization", "rouge", "fork"]
dependencies = ["six"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
rouge = "bin.rouge_cmd:main"

[project.urls]
Homepage = "https://github.com/fitzyracing1/rouge"
Source = "https://github.com/fitzyracing1/rouge"
Issues = "https://github.com/fitzyracing1/rouge/issues"
Changelog = "https://github.com/fitzyracing1/rouge/blob/master/CHANGELOG.md"
Upstream = "https://github.com/pltrdy/rouge"
"360 Bench" = "https://github.com/fitzyracing1/360-bench"

[tool.setuptools]
# Same packages as upstream rouge 1.0.1 (including its top-level `bin` package for the CLI).
packages = ["rouge", "bin"]
